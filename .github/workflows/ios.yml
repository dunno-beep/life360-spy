name: Build iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - run: |
          xcodebuild -project Life360.xcodeproj -scheme Life360 \
            -sdk iphoneos -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build
      - name: locate build
        run: |
          echo "--- apps under workspace ---"
          find . -name '*.app' -path '*Release-iphoneos*' -not -path '*/Index/*' | head -5
      - name: adhoc sign with entitlements
        run: |
          APP=$(find . -name '*.app' -path '*Release-iphoneos*' -not -path '*/Index/*' | head -1)
          echo "app: [$APP]"
          test -n "$APP" || { echo "NO APP FOUND"; exit 1; }
          APPEX=$(find "$APP" -name '*.appex' | head -1)
          echo "appex: [$APPEX]"
          if [ -n "$APPEX" ]; then
            codesign --force --sign - --timestamp=none --entitlements Life360.entitlements "$APPEX"
          else
            echo "NO APPEX FOUND"
          fi
          codesign --force --sign - --timestamp=none --entitlements Life360.entitlements "$APP"
          echo "--- embedded entitlements ---"
          codesign -d --entitlements - "$APP"
      - name: package
        run: |
          APP=$(find . -name '*.app' -path '*Release-iphoneos*' -not -path '*/Index/*' | head -1)
          echo "packaging [$APP]"
          mkdir -p Payload
          cp -r "$APP" Payload/
          zip -qr Life360.ipa Payload
          ls -la Life360.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Life360-ipa
          path: Life360.ipa
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest --title latest --notes "rolling build"
          gh release upload latest Life360.ipa --clobber
          echo "${{ github.sha }}" > version-ios.txt
          gh release upload latest version-ios.txt --clobber
