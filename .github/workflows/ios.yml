name: Build iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - run: |
          xcodebuild -project Life360.xcodeproj -scheme Life360 \
            -sdk iphoneos -configuration Release \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build
      - name: adhoc sign with entitlements
        run: |
          APP=build/Build/Products/Release-iphoneos/Life360.app
          codesign --force --sign - --timestamp=none --entitlements Keyboard.entitlements "$APP/PlugIns/Keyboard.appex"
          codesign --force --sign - --timestamp=none --entitlements Life360.entitlements "$APP"
          echo "--- embedded entitlements ---"
          codesign -d --entitlements - "$APP"
      - name: package
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/Life360.app Payload/
          zip -qr Life360.ipa Payload
          ls -la Life360.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Life360-ipa
          path: Life360.ipa
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest --title latest --notes "rolling build"
          gh release upload latest Life360.ipa --clobber
          echo "${{ github.sha }}" > version-ios.txt
          gh release upload latest version-ios.txt --clobber
